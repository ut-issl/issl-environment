name: Update package hashes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'pkgs/*/source.json'

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  update-package-hashes:
    name: Update package hashes
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: package-hashes-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out the head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package hashes
        run: |
          mapfile -t source_paths < <(git diff --name-only --diff-filter=d "origin/${GITHUB_BASE_REF}...HEAD" \
            -- ':(glob)pkgs/*/source.json')
          if [[ ${#source_paths[@]} -eq 0 ]]; then
            echo '::error::Found no changed pkgs/*/source.json against the base branch'
            exit 1
          fi

          names=()
          for source_path in "${source_paths[@]}"; do
            name="${source_path#pkgs/}"
            names+=("${name%/source.json}")
          done
          scripts/update-package-hashes.sh "${names[@]}"

      - name: Detect package hash changes
        id: package-hash-changes
        run: |
          if git diff --quiet -- pkgs; then
            echo 'No changes in the package hashes'
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure Git user
        if: steps.package-hash-changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit package hashes
        if: steps.package-hash-changes.outputs.changed == 'true'
        run: |
          git add -- pkgs
          git commit \
            --message='build(deps): update package hashes' \
            --message='Generated by scripts/update-package-hashes.sh.'

      - name: Push to the head branch
        if: steps.package-hash-changes.outputs.changed == 'true'
        run: git push origin "HEAD:${GITHUB_HEAD_REF}"
