name: Test config repository

on:
  workflow_call:
    inputs:
      os:
        description: 'Runner to run the tests on'
        required: false
        default: ubuntu-latest
        type: string
      flake-target:
        description: 'Home Manager configuration of the config repository to apply'
        required: false
        default: user
        type: string
      zsh-enabled:
        description: 'Whether the applied configuration enables Zsh'
        required: false
        default: true
        type: boolean
      common-repository:
        description: >-
          Repository that provides the environment tests and,
          with `override-issl-input`, the `issl` flake input
        required: false
        default: ut-issl/issl-environment
        type: string
      common-ref:
        description: 'Revision of `common-repository` to check out'
        required: false
        default: main
        type: string
      user-repository:
        description: 'Config repository to test, or empty for the calling repository'
        required: false
        default: ''
        type: string
      user-ref:
        description: >-
          Revision of `user-repository` to check out,
          or empty for the triggering revision of the calling repository or the default branch of another one
        required: false
        default: ''
        type: string
      override-issl-input:
        description: 'Whether to override the `issl` flake input with the checked-out `common-repository`'
        required: false
        default: false
        type: boolean
      timeout-minutes:
        description: 'Timeout of the test job in minutes'
        required: false
        default: 10
        type: number

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  test-config-repository:
    name: Test config repository
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Check out the common repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.common-repository }}
          ref: ${{ inputs.common-ref }}
          persist-credentials: false
          path: common

      - name: Check out the user repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.user-repository }}
          ref: ${{ inputs.user-ref }}
          persist-credentials: false
          path: user

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare test environment
        id: test-environment
        run: |
          tmpdir="$(mktemp -d)"
          home_dir="${tmpdir}/home"
          runtime_dir="${tmpdir}/runtime"

          # Seed the test HOME with the default Ubuntu skeleton dotfiles (~/.bashrc, ~/.profile, ~/.bash_logout).
          mkdir -p "${home_dir}"
          cp -a /etc/skel/. "${home_dir}/"

          # Create an empty runtime directory for the test session.
          mkdir -m 0700 "${runtime_dir}"

          {
            echo "home-dir=${home_dir}"
            echo "config-dir=${home_dir}/.config"
            echo "data-dir=${home_dir}/.local/share"
            echo "state-dir=${home_dir}/.local/state"
            echo "runtime-dir=${runtime_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply Home Manager configuration
        env:
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
          CONFIG_DIR: ${{ steps.test-environment.outputs.config-dir }}
          DATA_DIR: ${{ steps.test-environment.outputs.data-dir }}
          STATE_DIR: ${{ steps.test-environment.outputs.state-dir }}
          RUNTIME_DIR: ${{ steps.test-environment.outputs.runtime-dir }}
          FLAKE_TARGET: ${{ inputs.flake-target }}
          OVERRIDE_ISSL_INPUT: ${{ inputs.override-issl-input }}
        run: |
          cd user

          switch_args=(
            --impure
            --show-trace
          )

          if [[ ${OVERRIDE_ISSL_INPUT} == 'true' ]]; then
            switch_args+=(
              --override-input
              issl
              "path:${GITHUB_WORKSPACE}/common"
            )
          fi

          env \
            -u DBUS_SESSION_BUS_ADDRESS \
            HOME="${HOME_DIR}" \
            USER='issl-test' \
            XDG_CONFIG_HOME="${CONFIG_DIR}" \
            XDG_DATA_HOME="${DATA_DIR}" \
            XDG_STATE_HOME="${STATE_DIR}" \
            XDG_RUNTIME_DIR="${RUNTIME_DIR}" \
            nix run '.#home-manager' -- \
            switch --flake ".#${FLAKE_TARGET}" "${switch_args[@]}"

      - name: Add Home Manager profile to PATH
        env:
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
        run: echo "${HOME_DIR}/.nix-profile/bin" >> "${GITHUB_PATH}"

      - name: Test the environment
        env:
          COMMON_DIR: ${{ github.workspace }}/common
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
          CONFIG_DIR: ${{ steps.test-environment.outputs.config-dir }}
          STATE_DIR: ${{ steps.test-environment.outputs.state-dir }}
          ISSL_ENABLE_ZSH: ${{ case(inputs.zsh-enabled, '1', '0') }}
        run: bash ./common/tests/run.sh
