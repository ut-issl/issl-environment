name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  determine-changes:
    name: Determine changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      test: ${{ steps.changed-files.outputs.test_any_changed }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            test:
              - 'home-modules/**'
              - 'scripts/apply.sh'
              - 'scripts/bootstrap-host.sh'
              - 'scripts/setup.sh'
              - 'tests/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/test-config-repository.yaml'
              - '.github/workflows/test.yaml'

  script-based:
    name: Test script-based setup
    needs: determine-changes
    if: needs.determine-changes.outputs.test == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        entry-point:
          - apply
          - setup
        zsh:
          - enabled
          - disabled
        include:
          - zsh: enabled
            enable-zsh: '1'
          - zsh: disabled
            enable-zsh: '0'
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: common

      - name: Install Nix
        if: matrix.entry-point != 'setup'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare test environment
        id: test-environment
        run: |
          tmpdir="$(mktemp -d)"
          home_dir="${tmpdir}/home"

          # Seed the test HOME with the default Ubuntu skeleton dotfiles (~/.bashrc, ~/.profile, ~/.bash_logout).
          mkdir -p "${home_dir}"
          cp -a /etc/skel/. "${home_dir}/"

          {
            echo "home-dir=${home_dir}"
            echo "config-dir=${home_dir}/.config"
            echo "data-dir=${home_dir}/.local/share"
            echo "state-dir=${home_dir}/.local/state"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply Home Manager configuration (apply.sh)
        if: matrix.entry-point == 'apply'
        env:
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
          CONFIG_DIR: ${{ steps.test-environment.outputs.config-dir }}
          DATA_DIR: ${{ steps.test-environment.outputs.data-dir }}
          STATE_DIR: ${{ steps.test-environment.outputs.state-dir }}
          ENABLE_ZSH: ${{ matrix.enable-zsh }}
        run: |
          env \
            HOME="${HOME_DIR}" \
            USER='issl-test' \
            XDG_CONFIG_HOME="${CONFIG_DIR}" \
            XDG_DATA_HOME="${DATA_DIR}" \
            XDG_STATE_HOME="${STATE_DIR}" \
            ISSL_ENABLE_ZSH="${ENABLE_ZSH}" \
            GIT_USER_NAME='ISSL Test User' \
            GIT_USER_EMAIL='issl-test@example.com' \
            bash ./common/scripts/apply.sh

      - name: Apply Home Manager configuration (setup.sh)
        if: matrix.entry-point == 'setup'
        env:
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
          CONFIG_DIR: ${{ steps.test-environment.outputs.config-dir }}
          DATA_DIR: ${{ steps.test-environment.outputs.data-dir }}
          STATE_DIR: ${{ steps.test-environment.outputs.state-dir }}
          ENABLE_ZSH: ${{ matrix.enable-zsh }}
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C common branch ci-setup-entry HEAD

          env \
            HOME="${HOME_DIR}" \
            USER='issl-test' \
            XDG_CONFIG_HOME="${CONFIG_DIR}" \
            XDG_DATA_HOME="${DATA_DIR}" \
            XDG_STATE_HOME="${STATE_DIR}" \
            REPO_URL="file://${GITHUB_WORKSPACE}/common" \
            REPO_REF='ci-setup-entry' \
            ISSL_INSTALL_DOCKER='no' \
            ISSL_ENABLE_ZSH="${ENABLE_ZSH}" \
            GIT_USER_NAME='ISSL Test User' \
            GIT_USER_EMAIL='issl-test@example.com' \
            bash ./common/scripts/setup.sh

          echo '/nix/var/nix/profiles/default/bin' >> "${GITHUB_PATH}"

      - name: Add Home Manager profile to PATH
        env:
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
        run: echo "${HOME_DIR}/.nix-profile/bin" >> "${GITHUB_PATH}"

      - name: Test the environment
        env:
          COMMON_DIR: ${{ github.workspace }}/common
          HOME_DIR: ${{ steps.test-environment.outputs.home-dir }}
          CONFIG_DIR: ${{ steps.test-environment.outputs.config-dir }}
          STATE_DIR: ${{ steps.test-environment.outputs.state-dir }}
          ISSL_ENABLE_ZSH: ${{ matrix.enable-zsh }}
          EXPECTED_GIT_USER_NAME: ISSL Test User
          EXPECTED_GIT_USER_EMAIL: issl-test@example.com
        run: bash ./common/tests/run.sh

  repository-based:
    name: Test config-repository-based setup
    needs: determine-changes
    if: needs.determine-changes.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        flake-target:
          - user
          - user-desktop
    permissions:
      contents: read
    uses: $/.github/workflows/test-config-repository.yaml
    with:
      os: ${{ matrix.os }}
      flake-target: ${{ matrix.flake-target }}
      common-repository: ${{ github.repository }}
      common-ref: ${{ github.sha }}
      user-repository: ut-issl/personal-nix-config-template
      user-ref: '9a04c443486291fe9482c0777e39a8b075a4460a' # main
      override-issl-input: true

  check-test-results:
    name: Check test results
    needs:
      - determine-changes
      - script-based
      - repository-based
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check the job results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(jq --raw-output '
              to_entries[]
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key) finished with \(.value.result)."
            ' <<< "${JOB_RESULTS}")"
          if [[ -n ${failed_jobs} ]]; then
            while IFS= read -r failed_job; do
              echo "::error title=check-test-results::${failed_job}"
            done <<< "${failed_jobs}"
            exit 1
          fi
