---
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

update:
  repos:
    https://github.com/lycheeverse/lychee:
      include_tags: ['lychee-v*']

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
        fail_fast: true
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1066584123cce44a99b4818c2b2c4a7e732ff8e9  # frozen: v1.11.3
    hooks:
      - id: tombi-format
        args: [--error-on-warnings]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 539ea2e1c5a0eb8adeb5fe0b1e2eb66fa5827042  # frozen: v0.3.5
    hooks:
      - id: rumdl-check
        args: [--fix]

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nix fmt --
        language: system
        files: '\.nix$'
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, --simplify, --indent=2, --binary-next-line, --case-indent, --space-redirects]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1066584123cce44a99b4818c2b2c4a7e732ff8e9  # frozen: v1.11.3
    hooks:
      - id: tombi-lint
        args: [--error-on-warnings]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--format=standard, --strict]

  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b  # frozen: lychee-v0.24.2
    hooks:
      - id: lychee
        args: [--no-progress, --offline, .]
        pass_filenames: false

  - repo: local
    hooks:
      - id: deadnix
        name: deadnix
        entry: nix run --inputs-from . nixpkgs#deadnix -- --fail .
        language: system
        files: '\.nix$'
        pass_filenames: false

      - id: statix
        name: statix
        entry: nix run --inputs-from . nixpkgs#statix -- check .
        language: system
        files: '\.nix$'
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/commitizen-tools/commitizen
    rev: e153e14bdac00edc46e390e4f99cbc6bbf808ef6  # frozen: v4.19.4
    hooks:
      - id: commitizen
      - id: commitizen-branch
